<script>
const today=new Date(); today.setHours(0,0,0,0);

];

document.getElementById('weekListCreateForm').addEventListener('submit',e=>{e.preventDefault();const rows=[...document.querySelectorAll('#weekListRows .checklist-row')].map(r=>({text:r.querySelector('input[type=text]').value.trim(),checked:r.querySelector('input[type=checkbox]').checked})).filter(x=>x.text);const lines=rows.map(x=>x.text);if(!lines.length){toast('请至少添加一项清单内容');return}weekLists.push({id:Date.now(),title:document.getElementById('weekListTitleInput').value.trim(),lines,checked:rows.map(x=>x.checked),week:iso(selectedWeekStart)});localStorage.setItem('daybook-week-lists',JSON.stringify(weekLists));document.getElementById('weekListModal').classList.remove('open');render()});function renderLongItems(){const list=document.getElementById('goalList');if(!longItems.length){list.innerHTML='<div class="goal-empty">长期目标、持续任务和固定 routine 会显示在这里。</div>';return}list.innerHTML=longItems.map(g=>`<div class="goal-item ${g.done?'done':''}"><input type="checkbox" data-goal-check="${g.id}" ${g.done?'checked':''} aria-label="完成 ${esc(g.title)}"><div class="goal-text"><span class="goal-type">${esc(g.type)}</span>${esc(g.title)}</div><button type="button" class="goal-add-week" data-goal-week="${g.id}">加入本周</button></div>`).join('')}
function saveLongItems(){localStorage.setItem('daybook-long-items',JSON.stringify(longItems));renderLongItems()}
function openGoals(){document.getElementById('goalShade').classList.add('open');document.getElementById('goalDrawer').classList.add('open');renderLongItems()}
function closeGoals(){document.getElementById('goalShade').classList.remove('open');document.getElementById('goalDrawer').classList.remove('open')}
document.getElementById('goalTab').addEventListener('click',openGoals);document.getElementById('closeGoalDrawer').addEventListener('click',closeGoals);document.getElementById('goalShade').addEventListener('click',closeGoals);
document.getElementById('goalForm').addEventListener('submit',e=>{e.preventDefault();longItems.push({id:Date.now(),type:document.getElementById('goalType').value,title:document.getElementById('goalTitle').value.trim(),date:document.getElementById('goalDeadline').value,done:false});document.getElementById('goalTitle').value='';document.getElementById('goalDeadline').value='';saveLongItems();render()});
document.getElementById('goalList').addEventListener('change',e=>{if(e.target.matches('[data-goal-check]')){const g=longItems.find(x=>x.id===Number(e.target.dataset.goalCheck));if(g){g.done=e.target.checked;saveLongItems()}}});
document.getElementById('goalList').addEventListener('click',e=>{const b=e.target.closest('[data-goal-week]');if(!b)return;const g=longItems.find(x=>x.id===Number(b.dataset.goalWeek));if(g){g.week=iso(selectedWeekStart);saveLongItems();view='week';render();closeGoals();toast('已加入本周计划')}});renderLongItems();content.addEventListener('click',e=>{const day=e.target.closest('[data-select-date]');if(day){selectedDate=new Date(day.dataset.selectDate+'T00:00:00');view='day';render();return}if(e.target.closest('[data-open-goals]')){openGoals();return}const del=e.target.closest('[data-note-delete]');if(del){weekLists=weekLists.filter(n=>n.id!==Number(del.dataset.noteDelete));localStorage.setItem('daybook-week-lists',JSON.stringify(weekLists));render()}});
content.addEventListener('change',e=>{if(e.target.matches('[data-note-check]')){const n=weekLists.find(x=>x.id===Number(e.target.dataset.noteCheck));if(n){n.checked[Number(e.target.dataset.line)]=e.target.checked;localStorage.setItem('daybook-week-lists',JSON.stringify(weekLists));render()}}});
content.addEventListener('submit',e=>{if(e.target.id==='weekNoteForm'){e.preventDefault();const lines=document.getElementById('weekNoteLines').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);weekLists.push({id:Date.now(),title:document.getElementById('weekNoteTitle').value.trim(),lines,checked:lines.map(()=>false),week:iso(weekStart(selectedDate))});localStorage.setItem('daybook-week-lists',JSON.stringify(weekLists));render()}});
</script>
</body>
</html>
